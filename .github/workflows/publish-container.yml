name: Publish production container

on:
  workflow_run:
    workflows:
      - Verify
    types:
      - completed
    branches:
      - production

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/truenascommandcenter
  LEGACY_IMAGE_NAME: ${{ github.repository_owner }}/truenasappmanager

jobs:
  container:
    name: Build and publish container
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'production'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read release version
        id: version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < TrueNASCommandCenter/VERSION)"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"

      - name: Resolve release tag
        id: release-tag
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          existing_sha="$(git ls-remote origin "refs/tags/v${RELEASE_VERSION}" | awk '{print $1}')"
          if [[ -n "$existing_sha" && "$existing_sha" != "$RELEASE_SHA" ]]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Production release skipped::Version ${RELEASE_VERSION} already belongs to commit ${existing_sha}. Increment VERSION to publish this production commit."
            {
              echo "## Production release skipped"
              echo
              echo "Version \`${RELEASE_VERSION}\` already belongs to commit \`${existing_sha}\`."
              echo "Increment \`TrueNASCommandCenter/VERSION\` to publish commit \`${RELEASE_SHA}\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          if [[ -n "$existing_sha" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.release-tag.outputs.publish == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        if: steps.release-tag.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        if: steps.release-tag.outputs.publish == 'true'
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY }}/${{ env.LEGACY_IMAGE_NAME }}
          tags: |
            type=raw,value=production
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=${{ steps.version.outputs.minor }}
            type=raw,value=sha-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}

      - name: Build and publish image
        if: steps.release-tag.outputs.publish == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./TrueNASCommandCenter
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag release commit
        if: steps.release-tag.outputs.publish == 'true' && steps.release-tag.outputs.exists != 'true'
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git tag "v${RELEASE_VERSION}" "$RELEASE_SHA"
          git push origin "v${RELEASE_VERSION}"
