name: Verify

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate application version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < TrueNASCommandCenter/VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain one semantic version such as 1.2.3."
            exit 1
          fi

      - name: Validate PWA install behavior
        run: |
          node --check TrueNASCommandCenter/CommandCenterBlazor/wwwroot/pwa-install-guide.js
          node --check TrueNASCommandCenter/CommandCenterBlazor/wwwroot/pwa.js
          node --check TrueNASCommandCenter/CommandCenterBlazor/wwwroot/service-worker.js
          node --test TrueNASCommandCenter/Tests/PwaInstallGuide.Tests.mjs

      - name: Set up .NET
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore TrueNASCommandCenter/TrueNASCommandCenter.slnx

      - name: Build
        run: dotnet build TrueNASCommandCenter/TrueNASCommandCenter.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test TrueNASCommandCenter/TrueNASCommandCenter.slnx --configuration Release --no-build
